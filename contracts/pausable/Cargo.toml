[package]
name = "compliance-pausable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared pausable helper for compliance-primitives contracts. Not a contract itself — no #[contract] macro, no wasm exports."
readme = "README.md"
keywords = ["soroban", "stellar", "compliance", "pausable"]
categories = ["cryptography::cryptocurrencies", "no-std"]

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
