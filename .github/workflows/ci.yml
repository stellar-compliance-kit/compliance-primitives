name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  migration-test:
    name: previous-release WASM upgrade test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Upgrade previous release WASM to HEAD
        run: bash scripts/test-migration.sh

  smoke-test:
    name: CLI smoke test (local network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install stellar CLI
        run: cargo install --locked stellar-cli
      - name: Run smoke test
        run: bash scripts/smoke-test.sh

  workspace-members:
    name: workspace members check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every contracts/ and examples/ crate is a workspace member
        run: ./scripts/check-workspace-members.sh

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Run doc tests
        run: cargo test --workspace --doc --verbose

  feature-flags:
    name: cargo check (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - --no-default-features
          - --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check workspace with ${{ matrix.features }}
        run: cargo check --workspace ${{ matrix.features }}

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budget-regression:
    name: budget regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run budget regression tests
        run: cargo test --workspace budget_regression -- --nocapture

  wasm-build:
    name: wasm32v1-none build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # Explicitly cache the wasm32v1-none target directory in addition to the
      # native target/ tree.  Swatinem/rust-cache@v2 keys on the host triple by
      # default; the cross-compiled wasm target lives in a separate subdirectory
      # (target/wasm32v1-none/) and may not be included in the default cache
      # entry depending on the runner's Rust sysroot layout.  Setting
      # `cache-targets: "true"` and adding a shared-key suffix scoped to the
      # wasm target ensures the release build artifacts are preserved between
      # runs and avoids a full rebuild on every push.
      - name: Cache cargo (wasm target)
        uses: Swatinem/rust-cache@v2
        with:
          # Scope this cache entry to the wasm target so it doesn't collide
          # with the native-target entries used by the test/clippy jobs.
          shared-key: wasm32v1-none
          # Cache the wasm release artifacts explicitly.
          cache-targets: "true"
      - name: Build contracts to wasm
        run: cargo build --workspace --target wasm32v1-none --release

  wasm-size-budget:
    name: wasm size budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      WASM_SIZE_REPORT: ${{ runner.temp }}/wasm-size-report.md
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # Use the same shared-key as the wasm-build job so this job can reuse
      # the cached wasm32v1-none release artifacts rather than rebuilding them.
      - name: Cache cargo (wasm target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32v1-none
          cache-targets: "true"
      - name: Check wasm binary sizes against budget
        run: bash scripts/check-wasm-size.sh
      # Runs even when the check fails so the table explains the failure.
      # Skipped for fork PRs, whose GITHUB_TOKEN cannot write comments.
      - name: Post wasm size table to PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.WASM_SIZE_REPORT;
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Update the previous table in place so each PR keeps one comment.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes('<!-- wasm-size-budget -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cost-table:
    name: cost table (BENCHMARKS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # tomllib needs 3.11+
      # Regenerate from budget-baselines.toml, then fail if the committed
      # table is stale. Run the script locally to fix the diff.
      - name: Regenerate cost table
        run: python3 scripts/gen-cost-table.py
      - name: Fail if BENCHMARKS.md cost table is stale
        run: git diff --exit-code -- BENCHMARKS.md

  accessibility:
    name: accessibility audit (web/)
    runs-on: ubuntu-latest
    # Non-blocking for now (per the issue that introduced this job): a
    # failure here is reported but doesn't fail the overall CI run. Once
    # the audit has been stable for a while, remove continue-on-error to
    # make it blocking like the other jobs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit tooling (downloads Puppeteer's bundled Chromium)
        run: npm ci
      - name: Run axe-core against web/index.html
        run: node scripts/check-accessibility.mjs

  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  docs-interfaces-diff:
    name: docs/interfaces diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install stellar CLI
        run: |
          curl -s https://raw.githubusercontent.com/stellar/stellar-cli/master/install.sh | bash
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Regenerate interface docs
        run: ./scripts/regenerate-docs.sh
      - name: Check for differences
        run: |
          # `git status --porcelain` also catches untracked files (e.g. a new
          # contract whose interface was generated but never committed).
          if [ -z "$(git status --porcelain docs/interfaces/)" ]; then
            echo "✓ docs/interfaces is up to date"
          else
            echo "✗ docs/interfaces is out of date. Run ./scripts/regenerate-docs.sh and commit the changes."
          git status --porcelain docs/interfaces/
          git diff docs/interfaces/
          exit 1
          fi

  docs-errors:
    name: docs/ERRORS.md up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate error code docs
        run: python3 scripts/generate-errors-docs.py
      - name: Check for differences
        run: |
          # `git status --porcelain` also catches the file never having been
          # committed (e.g. after a fresh clone).
          if [ -z "$(git status --porcelain docs/ERRORS.md)" ]; then
            echo "✓ docs/ERRORS.md is up to date"
          else
            echo "✗ docs/ERRORS.md is out of date. Run python3 scripts/generate-errors-docs.py and commit the changes."
            git status --porcelain docs/ERRORS.md
            git diff docs/ERRORS.md
            exit 1
          fi

  examples-test:
    name: test all examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Enumerate and test examples
        run: |
          set -e
          EXAMPLES_DIR="examples"
          FAILED_CRATES=()

          echo "Testing all example crates..."
          for dir in "$EXAMPLES_DIR"/*; do
            if [ -d "$dir" ]; then
              CRATE_NAME=$(basename "$dir")
              if [ -f "$dir/Cargo.toml" ]; then
                echo "Testing $CRATE_NAME..."
                if ! cargo test -p "$CRATE_NAME" --verbose; then
                  FAILED_CRATES+=("$CRATE_NAME")
                fi
              else
                # Non-crate directories (e.g. js-client, README-only dirs) are skipped.
                echo "Skipping $CRATE_NAME (no Cargo.toml)"
              fi
            fi
          done

          if [ ${#FAILED_CRATES[@]} -ne 0 ]; then
            echo "ERROR: The following example crates failed tests:"
            printf '  - %s\n' "${FAILED_CRATES[@]}"
            exit 1
          fi

          echo "All example crates passed tests."

  dead-code-allows:
    name: dead_code allow lint
    runs-on: ubuntu-latest
    # Fail if any #[allow(dead_code)] added in this PR is missing a linked
    # issue reference (#NNN) in the same line or the line immediately above.
    # This prevents untracked dead code from silently accumulating.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch for diff
        run: git fetch origin main
      - name: Check new #[allow(dead_code)] for linked issue references
        run: bash scripts/check-dead-code-allows.sh

  changelog-version-sync:
    name: changelog version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check CHANGELOG.md and version are in sync
        run: ./scripts/check-changelog.sh

  per-contract-changelog:
    name: per-contract changelog check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history to build the changelog.
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Regenerate per-contract changelog sections
        run: ./scripts/generate-contract-changelogs.sh
      - name: Check for differences
        run: |
          # `git status --porcelain` also catches untracked files (e.g. a new
          # contract whose changelog section was generated but never committed).
          if [ -z "$(git status --porcelain CHANGELOG.md)" ]; then
            echo "✓ per-contract CHANGELOG sections are up to date"
          else
            echo "✗ CHANGELOG.md is out of date. Run ./scripts/generate-contract-changelogs.sh and commit the changes."
            git status --porcelain CHANGELOG.md
            git diff CHANGELOG.md
            exit 1
          fi

  contract-line-count:
    name: contract line-count guideline check
    runs-on: ubuntu-latest
    # Warning only — a contract growing past ~300 lines gets a visible nudge
    # without blocking the PR.  Set HARD_FAIL=1 (or remove continue-on-error)
    # once the guideline is enforced more strictly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Flag contracts over the ~300-line guideline
        run: bash scripts/check-contract-line-count.sh

  semver-checks:
    name: cargo semver-checks (compliance-pausable)
    runs-on: ubuntu-latest
    # Check for accidental breaking API changes in published crates against
    # crates.io. Contract crates are publish = false and use the
    # semver-checks-contracts job below instead.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks
      - name: Check semver compliance for compliance-pausable
        run: cargo semver-checks check-release --package compliance-pausable

  fuzz:
    name: cargo fuzz (jurisdiction_validate_code)
    runs-on: ubuntu-latest
    # Bounded fuzz run for the jurisdiction code parser (#816).  Uses nightly
    # because cargo-fuzz requires it, and runs the target for a fixed number
    # of seconds so the job stays within CI time limits.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run jurisdiction_validate_code fuzz target
        run: cargo fuzz run jurisdiction_validate_code -- -max_total_time=60

  release-metadata:
    name: contractmeta version/source check
    runs-on: ubuntu-latest
    # Every deployed contract WASM must carry `version` and `source`
    # contractmeta entries so releases can be identified on-chain (#809).
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo (wasm target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32v1-none
          cache-targets: "true"
      - name: Build contracts to wasm
        run: cargo build --workspace --target wasm32v1-none --release
      - name: Verify contractmeta version and source in each artifact
        run: |
          set -e
          status=0
          found=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -e "$wasm" ] || continue
            found=1
            echo "Checking $wasm"
            for key in version source; do
              if ! grep -aq "$key" "$wasm"; then
                echo "✗ $wasm is missing contractmeta key '$key'"
                status=1
              fi
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "✗ No wasm artifacts found in target/wasm32v1-none/release/"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "✗ One or more contracts are missing contractmeta version/source entries."
            exit 1
          fi
          echo "✓ All contract artifacts contain contractmeta version and source."
