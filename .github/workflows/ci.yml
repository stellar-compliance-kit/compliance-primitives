name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Run doc tests
        run: cargo test --workspace --doc --verbose

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budget-regression:
    name: budget regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run budget regression tests
        run: cargo test --workspace budget_regression -- --nocapture

  wasm-build:
    name: wasm32v1-none build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build contracts to wasm
        run: cargo build --workspace --target wasm32v1-none --release

  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  examples-test:
    name: test all examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Enumerate and test examples
        run: |
          set -e
          EXAMPLES_DIR="examples"
          FAILED_CRATES=()
          
          echo "Testing all example crates..."
          for dir in "$EXAMPLES_DIR"/*; do
            if [ -d "$dir" ]; then
              CRATE_NAME=$(basename "$dir")
              if [ -f "$dir/Cargo.toml" ]; then
                echo "Testing $CRATE_NAME..."
                if ! cargo test -p "$CRATE_NAME" --verbose; then
                  FAILED_CRATES+=("$CRATE_NAME")
                fi
              else
                echo "ERROR: Directory $dir exists but has no Cargo.toml"
                exit 1
              fi
            fi
          done
          
          if [ ${#FAILED_CRATES[@]} -ne 0 ]; then
            echo "ERROR: The following example crates failed tests:"
            printf '  - %s\n' "${FAILED_CRATES[@]}"
            exit 1
          fi
          
          echo "All example crates passed tests."
